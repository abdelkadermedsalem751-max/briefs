<style>
html,body{margin:0;background:#EEF3F7}
#lb{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#0E2F45;border-bottom:3px solid #F7931E;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
#lb .lbn{color:#FFFFFF;font-weight:700;letter-spacing:2px;font-size:14px;padding:0 4px}
#lb .lbr{display:inline-flex;align-items:center;gap:8px}
#lb .lbk{min-height:38px;padding:0 14px;border:1px solid #3B6A8A;border-radius:999px;background:#123A55;color:#FFFFFF;font:inherit;font-size:14px;cursor:pointer}
#lb .lbw{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:#1769FF;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:14px}
#lb .lbw b{font-family:Arial,sans-serif}
#lb .lbs{display:inline-flex;background:#123A55;border-radius:999px;padding:3px;gap:2px}
#lb .lbs button{min-width:38px;min-height:32px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:#C9D7E2;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
#lb .lbs button[aria-pressed=true]{background:#F7931E;color:#1A1206}
html,body{max-width:100%;overflow-x:hidden}
#app img,#app svg{max-width:100%}
#app pre{overflow-wrap:anywhere}
#app footer a{max-width:100%;box-sizing:border-box;height:auto!important;min-height:44px;overflow-wrap:anywhere}
#app footer a span{overflow-wrap:anywhere}
@media (max-width:520px){#lb{padding:6px 8px;gap:6px}#lb .lbn{display:none}#lb .lbr{gap:6px}#lb .lbw{min-height:34px;padding:0 10px;font-size:13px}#lb .lbk{min-height:34px;padding:0 10px;font-size:13px}#lb .lbs button{min-width:32px;min-height:28px;padding:0 6px}}
@media (max-width:360px){#lb .lbw span.t{display:none}}

var HOME_CSS="\n.hm{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#16252F;background:#EEF3F7;min-height:100vh}\n.hh{background:#0E2F45;color:#FFFFFF}\n.hh img{display:block;width:100%;height:clamp(120px,18vw,240px);object-fit:cover}\n.hw{max-width:1120px;margin:0 auto;padding:32px 20px 40px;display:flex;flex-direction:column;gap:14px}\n.hk{margin:0;color:#F7931E;font-weight:700;font-size:15px}\n.hh h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.25}\n.hp{margin:0;max-width:720px;color:#C9D7E2;font-size:17px;line-height:1.8}\n.hq{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:8px}\n.hq span{font-weight:700}\n.hls{display:inline-flex;flex-wrap:wrap;gap:8px}\n.hl{min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid #5C7E96;background:transparent;color:#FFFFFF;font:inherit;font-size:16px;cursor:pointer}\n.hl[aria-pressed=true]{background:#F7931E;border-color:#F7931E;color:#1A1206;font-weight:700}\n.hg{max-width:1120px;margin:0 auto;padding:32px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}\n.hc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border-radius:22px;border:1px solid #D8E2EA;background:#FFFFFF;color:#16252F;font:inherit;text-align:start;cursor:pointer;transition:border-color .15s,box-shadow .15s}\n.hc:hover{border-color:#F7931E;box-shadow:0 0 0 4px rgba(247,147,30,.18)}\n.hi{width:54px;height:54px;border-radius:16px;background:#123A55;color:#FFFFFF;display:flex;align-items:center;justify-content:center}\n.hn{position:absolute;top:18px;inset-inline-end:20px;color:#9AB0C0;font-weight:700;font-size:14px}\n.hc strong{font-size:20px}\n.hd2{color:#4F6470;font-size:15px;line-height:1.7}\n.ho{margin-top:auto;color:#B85F00;font-weight:700;font-size:15px}\n.hf{background:#0E2F45;color:#FFFFFF;border-top:4px solid #5C64C4;padding:28px 20px 36px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items var SRC={"Main":{"tpl":"<div dir=\"rtl\" style=\"background: #EEF3F7; color: #16252F; font-family: 'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif; min-height: 100vh\">\n\n<header style=\"background: #0E2F45; color: #FFFFFF; border-bottom: 4px solid #F7931E\">\n<img src=\"@@BANNER@@\" alt=\"عبد القادر محمد سالم — مصمم جرافيك\" style=\"display: block; width: 100%; height: clamp(150px, 18vw, 240px); object-fit: cover; object-position: center\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 48px 24px 52px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"background: #F7931E; color: #1A1206; font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 6px 14px; border-radius: 999px\">LOGO DESIGN BRIEF<\/span>\n<span style=\"background: #5C64C4; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px\">نموذج تفاعلي<\/span>\n<\/div>\n<h1 style=\"margin: 0; font-size: 52px; line-height: 1.2; font-weight: 700\">بريف تصميم الشعار<\/h1>\n<p style=\"margin: 0; max-width: 700px; font-size: 18px; line-height: 1.8; color: #C9D7E2\">أهلاً بك! هذا النموذج يساعدني على فهم علامتك التجارية بدقة قبل البدء. اختر الأنماط والألوان والخطوط التي تعبّر عنك — وستتلوّن نماذج الشعارات بألوانك مباشرة — ثم اضغط «إرسال» في الأسفل لتصلني إجاباتك على الواتساب والبريد الإلكتروني.<\/p>\n<div style=\"display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; color: #AFC3D2\">\n<span>يستغرق ٥–٨ دقائق<\/span>\n<span>٧ أقسام<\/span>\n<span>كل الحقول اختيارية عدا الاسم واسم العلامة<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<main style=\"max-width: 1120px; margin: 0 auto; padding: 48px 24px 32px; display: flex; flex-direction: column; gap: 36px\">\n\n<section style=\"background: #FFFFFF; border: 1px solid #DCE6E3; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; align-items: center; gap: display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 14px\">\n<sc-for list=\"{{ g.type }}\" as=\"it\" hint-placeholder-count=\"8\">\n<button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.card }}\">\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"{{ it.badge }}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M8 3l4 3 4-3\"><\/path><\/svg><\/span><strong style=\"font-size: 16px\">{{ it.name }}<\/strong><\/span>\n<span style=\"font-size: 14px; color: #4A5F6A; line-height: 1.6\">{{ it.desc }}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div class=\"hd\"><span class=\"num\">03<\/span><h2 class=\"h2\">ماذا تحتاج مني؟<\/h2><\/div>\n<p class=\"sub\">التصوير، أم المونتاج فقط، أم الاثنان معاً؟<\/p>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px\">\n<sc-for list=\"{{ g.scope }}\" as=\"it\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.card }}\">\n<strong style=\"font-size: 18px; color: #123A55\">{{ it.name }}<\/strong>\n<span style=\"font-size: 14px; color: #4A5F6A; line-height: 1.6\">{{ it.desc }}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{ needsShoot }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; background: #F2F6F9; border: 1px solid #D8E2EA; border-radius: 18px; padding: 22px\">\n<strong style=\"font-size: 17px; color: #123A55\">تفاصيل التصوير<\/strong>\n<div class=\"blk\"><h3 class=\"h3\">مكان التصوير<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.location }}\" as=\"it\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">عدد الكاميرات<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.cams }}\" as=\"it\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"fld\"><label class=\"lbl\" for=\"p-where\">المدينة / العنوان وتاريخ التصوير المقترح<\/label><input class=\"inp\" id=\"p-where\" type=\"text\" onChange=\"{{ on.where }}\"><\/div>\n<\/div>\n<\/sc-if>\n<div class=\"blk\">\n<h3 class=\"h3\">الخدمات المطلوبة<\/h3>\n<div class=\"pills\">\n<sc-for list=\"{{ g.services }}\" as=\"it\" hint-placeholder-count=\"10\">\n<button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div class=\"hd\"><span class=\"num\">04<\/span><h2 class=\"h2\">المونتاج والكابشن<\/h2><\/div>\n<p class=\"sub\">شاهد المعاينة تتغيّر مع اختياراتك: ألوان الشارة، اسم البرنامج، ولغة الكابشن.<\/p>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div class=\"blk\"><h3 class=\"h3\">أسلوب المونتاج<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.edit }}\" as=\"it\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">الكابشن (النص على الشاشة)<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.caption }}\" as=\"it\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">نوع الكابشن<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.capstyle }}\" as=\"it\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">لغة الكلام في البرنامج<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.speech }}\" as=\"it\" hint-placeholder-count=\"4\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<\/div>\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 14px; color: #4F6470; font-weight: 500\">معاينة الشاشة<\/span>\n<div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #1B2733\">\n<div aria-hidden=\"true\" style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center\"><svg width=\"120\" height=\"120\" viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"44\" r=\"22\" fill=\"#33475A\"><\/circle><path d=\"M18 120 C22 86 40 74 60 74 C80 74 98 86 102 120 Z\" fill=\"#33475A\"><\/path><\/svg><\/div>\n<div style=\"{{ bugStyle }}\">{{ progName }}<\/div>\n<div style=\"position: absolute; right: 5%; bottom: 30%; display: flex; flex-direction: column; align-items: flex-start; max-width: 70%\">\n<span style=\"{{ ltName }}\">{{ hostName }}<\/span>\n<span style=\"{{ ltRole }}\">{{ progName }}<\/span>\n<\/div>\n<sc-if value=\"{{ showCap }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position: absolute; left: 6%; right: 6%; bottom: 6%; display: flex; flex-direction: column; align-items: center; gap: 4px\">\n<sc-for list=\"{{ capLines }}\" as=\"cl\" hint-placeholder-count=\"1\">\n<span style=\"{{ cl.style }}\">{{ cl.text }}<\/span>\n<\/sc-for>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<div class=\"hd\"><span class=\"num\">05<\/span><h2 class=\"h2\">الحلقات والعرض<\/h2><\/div>\n<div class=\"blk\"><h3 class=\"h3\">عدد الحلقات<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.episodes }}\" as=\"it\" hint-placeholder-count=\"4\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">مدة الحلقة<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.length }}\" as=\"it\" hint-placeholder-count=\"4\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">أين سيُعرض؟<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.where }}\" as=\"it\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div class=\"blk\"><h3 class=\"h3\">مقاس الفيديو<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.ratio }}\" as=\"it\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<\/section>\n\n<section class=\"sec\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div class=\"hd\"><span class=\"num\">06<\/span><h2 class=\"h2\">هوية البرنامج<\/h2><\/div>\n<p class=\"sub\">اختر حتى ٤ ألوان. أول لونين يظهران في معاينة الشاشة (الشارة واسم الضيف).<\/p>\n<\/div>\n<div class=\"blk\"><h3 class=\"h3\">هل للبرنامج شعار وشارة؟<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.identity }}\" as=\"it\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{ it.sel }}\" onClick=\"{{ it.pick }}\" style=\"{{ it.pill }}\">{{ it.name }}<\/button><\/sc-for>\n<\/div><\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100px, 100%), 1fr)); gap: 14px\">\n<sc-for list=\"{{ g.colors }}\" as=\"c\" hint-placeholder-count=\"16\">\n<button type=\"button\" aria-pressed=\"{{ c.sel }}\" onClick=\"{{ c.pick }}\" style=\"background: none; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 8px; color: #16252F\">\n<span style=\"{{ c.swatch }}\"><\/span>\n<span style=\"font-size: 14px; display: flex; gap: 6px; justify-content: center; align-items: center\">{{ c.name }}<sc-if value=\"{{ c.sel }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12px; font-weight: 700; color: #1A1206; background: #F7931E; border-radius: 999px; padding: 0 7px\">{{ c.order }}<\/span><\/sc-if><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<div class=\"hd\"><span class=\"num\">07<\/span><h2 class=\"h2\">المواد والمراجع<\/h2><\/div>\n<div class=\"fields\">\n<div class=\"fld\"><label class=\"lbl\" for=\"p-files\">رابط المواد المصوّرة (Google Drive أو غيره)<\/label><input class=\"inp\" id=\"p-files\" type=\"text\" dir=\"ltr\" onChange=\"{{ on.files }}\" style=\"text-align: right\"><\/div>\n<div class=\"fld\"><label class=\"lbl\" for=\"p-refs\">برامج تعجبك (روابط أو أسماء)<\/label><input class=\"inp\" id=\"p-refs\" type=\"text\" dir=\"auto\" onChange=\"{{ on.refs }}\"><\/div>\n<\/div>\n<div class=\"fld\"><label class=\"lbl\" for=\"p-script\">السكريبت أو محاور الحلقة (إن وُجد)<\/label><textarea class=\"ta\" id=\"p-script\" rows=\"4\" onChange=\"{{ on.script }}\"><\/textarea><\/div>\n<\/section>\n\n<section class=\"sec\">\n<div class=\"hd\"><span class=\"num\">08<\/span><h2 class=\"h2\">الموعد والميزانية<\/h2><\/div>\n<div class=\"blk\"><h3 class=\"h3\">متى تحتاج أول حلقة؟<\/h3><div class=\"pills\">\n<sc-for list=\"{{ g.urgency }}\
